[workspace]
resolver = "2"
members = [
    "contracts/property_vault",
    "contracts/revenue",
    "contracts/shared",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies]
soroban-sdk = "22.0.0"
