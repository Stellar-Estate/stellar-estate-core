name: Stellar Estate Core CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Backend Vitest Test Suite
        run: npm test

      - name: Build Backend TypeScript
        run: npm run build

  contracts-test:
    name: Soroban Contracts Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Pin Incompatible Transitive Dependencies
        run: |
          cargo generate-lockfile
          cargo update -p ed25519-dalek --precise 2.1.1 || true
          cargo update -p ed25519 --precise 2.2.3 || true

      - name: Format Rust Code
        run: cargo fmt --all

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Soroban Contract Unit & Integration Tests
        run: cargo test --workspace --verbose
