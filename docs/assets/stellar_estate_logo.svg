<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="logo-stellar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08B5E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Solid Background Frame (renders in light & dark mode) -->
  <rect width="1000" height="240" fill="url(#logo-bg)" rx="16" stroke="#1e293b" stroke-width="2"/>

  <!-- Glowing Corner Accents -->
  <circle cx="80" cy="80" r="100" fill="#08B5E5" fill-opacity="0.06"/>
  <circle cx="920" cy="160" r="120" fill="#8B5CF6" fill-opacity="0.06"/>

  <!-- Logo Icon Badge -->
  <rect x="50" y="45" width="150" height="150" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="125" cy="120" r="54" fill="url(#logo-stellar)" fill-opacity="0.2"/>
  
  <!-- Architectural Property Vault + Stellar Geometry -->
  <polygon points="125,75 165,100 165,145 125,165 85,145 85,100" fill="none" stroke="url(#logo-stellar)" stroke-width="3"/>
  <polygon points="125,85 155,105 155,140 125,155 95,140 95,105" fill="#0b1120" stroke="#08B5E5" stroke-width="1.5"/>
  <polygon points="125,95 145,110 145,135 125,145 105,135 105,110" fill="url(#logo-stellar)"/>
  
  <!-- Stellar Star Cross -->
  <line x1="125" y1="65" x2="125" y2="175" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="75" y1="120" x2="175" y2="120" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- Main Brand Typography -->
  <text x="230" y="112" fill="url(#text-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="1">STELLAR ESTATE</text>
  
  <!-- Badge: Protocol 22 Soroban -->
  <rect x="670" y="78" width="130" height="28" rx="14" fill="#08b5e5" fill-opacity="0.15" stroke="#08b5e5" stroke-width="1.5"/>
  <text x="735" y="96" fill="#08b5e5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PROTOCOL 22</text>
  
  <rect x="815" y="78" width="135" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="882" y="96" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SOROBAN RWA</text>

  <!-- Tagline / Descriptor -->
  <text x="232" y="148" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600">Programmable Real-World Asset Property-Revenue Settlement Platform</text>
  <text x="232" y="174" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13">Deterministic Waterfalls • Zero-Dust Integer Arithmetic • Cryptographic Agreement Consensus</text>
</svg>