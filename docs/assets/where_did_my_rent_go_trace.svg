<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" style="background:#070a13; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="trace-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08B5E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0b101d"/>
    </linearGradient>
  </defs>

  <text x="500" y="45" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">"WHERE DID MY RENT GO?" — AUDIT TRAIL VISUAL TRACE</text>
  <text x="500" y="70" fill="#94A3B8" font-size="12" text-anchor="middle">Every cent is deterministically accounted for from tenant payment to final on-chain recipient</text>

  <!-- Flow Line -->
  <line x1="120" y1="160" x2="880" y2="160" stroke="url(#trace-line)" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Step 1: Deposit -->
  <circle cx="120" cy="160" r="28" fill="#08B5E5" fill-opacity="0.2" stroke="#08B5E5" stroke-width="2"/>
  <text x="120" y="166" fill="#08B5E5" font-size="14" font-weight="bold" text-anchor="middle">1</text>
  <rect x="30" y="210" width="180" height="120" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1"/>
  <text x="120" y="235" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Revenue Ingested</text>
  <text x="120" y="255" fill="#08B5E5" font-size="16" font-weight="800" text-anchor="middle">$25,000.00</text>
  <text x="120" y="275" fill="#94A3B8" font-size="10" text-anchor="middle">Tenant Stellar Tx</text>
  <text x="120" y="295" fill="#64748B" font-size="9" font-family="monospace" text-anchor="middle">Ledger #5080686</text>

  <!-- Step 2: Agreement Binding -->
  <circle cx="370" cy="160" r="28" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="2"/>
  <text x="370" y="166" fill="#3B82F6" font-size="14" font-weight="bold" text-anchor="middle">2</text>
  <rect x="280" y="210" width="180" height="120" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1"/>
  <text x="370" y="235" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Locked Agreement</text>
  <text x="370" y="255" fill="#F59E0B" font-size="14" font-weight="700" text-anchor="middle">Version 2 (Locked)</text>
  <text x="370" y="275" fill="#94A3B8" font-size="10" text-anchor="middle">SHA-256 Verified</text>
  <text x="370" y="295" fill="#10B981" font-size="9" text-anchor="middle">✓ 100% Approvals</text>

  <!-- Step 3: Waterfall Engine -->
  <circle cx="630" cy="160" r="28" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="2"/>
  <text x="630" y="166" fill="#8B5CF6" font-size="14" font-weight="bold" text-anchor="middle">3</text>
  <rect x="540" y="210" width="180" height="120" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1"/>
  <text x="630" y="235" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Waterfall Engine</text>
  <text x="630" y="255" fill="#EF4444" font-size="11" text-anchor="middle">Opex: -$3,750 (15%)</text>
  <text x="630" y="273" fill="#F59E0B" font-size="11" text-anchor="middle">Reserve: -$2,500 (10%)</text>
  <text x="630" y="295" fill="#08B5E5" font-size="11" font-weight="bold" text-anchor="middle">Yield: $18,750 (75%)</text>

  <!-- Step 4: Reconciled Payouts -->
  <circle cx="880" cy="160" r="28" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2"/>
  <text x="880" y="166" fill="#10B981" font-size="14" font-weight="bold" text-anchor="middle">4</text>
  <rect x="790" y="210" width="180" height="120" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1"/>
  <text x="880" y="235" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Stellar Settlement</text>
  <text x="880" y="255" fill="#10B981" font-size="12" font-weight="bold" text-anchor="middle">Alice: $8,437.50</text>
  <text x="880" y="273" fill="#10B981" font-size="12" font-weight="bold" text-anchor="middle">Bob: $6,562.50</text>
  <text x="880" y="295" fill="#10B981" font-size="12" font-weight="bold" text-anchor="middle">Charlie: $3,750.00</text>

  <!-- Bottom Invariant Proof Banner -->
  <rect x="100" y="380" width="800" height="70" rx="10" fill="#0c1724" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="408" fill="#10B981" font-size="14" font-weight="bold" text-anchor="middle">ZERO-DUST DETERMINISTIC INVARIANT PROVEN</text>
  <text x="500" y="430" fill="#94A3B8" font-size="11" text-anchor="middle">Ingested = Expenses + Reserve + Distributed | Indivisible Remainders Awarded to Primary Stakeholder</text>
</svg>
