version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stellar-estate-postgres
    restart: always
    environment:
      POSTGRES_USER: stellar_user
      POSTGRES_PASSWORD: stellar_password
      POSTGRES_DB: stellar_estate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stellar-estate-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://stellar_user:stellar_password@postgres:5432/stellar_estate
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  pgdata:
