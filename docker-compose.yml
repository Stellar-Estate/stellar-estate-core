version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stellar-estate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stellar_user
      POSTGRES_PASSWORD: stellar_password
      POSTGRES_DB: stellar_estate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellar_user -d stellar_estate"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stellar-estate-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stellar-estate-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://stellar_user:stellar_password@postgres:5432/stellar_estate
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stellar-estate-net

networks:
  stellar-estate-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
